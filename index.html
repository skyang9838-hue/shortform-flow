<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숏폼 제작 흐름</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0a0a0b; --panel:#141416; --panel2:#1a1a1d; --panel3:#222226;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#f1ebe1; --ink2:#b7b0a5; --ink3:#7c776e; --ink4:#55514b;
  --or:#ff7a1a; --or2:#ffa04d; --or3:#ffc48f; --orbg:#2a1a0e; --fl:#5bb1ff;
  --flap:"IBM Plex Sans KR",Pretendard,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 500px at 70% -10%,rgba(255,122,26,.07),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
em{font-style:normal;color:var(--or2)}
.app{height:calc(100vh / var(--z,1));display:grid;grid-template-rows:auto auto auto 1fr auto;gap:12px;padding:14px 28px 14px;max-width:1800px;margin:0 auto}

/* 머리줄 */
header{display:flex;align-items:center;gap:12px;height:40px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--or);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(255,122,26,.7)}
.mark svg{width:17px;height:17px;fill:none;stroke:#1a0d02;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
header h1{font-family:var(--flap);font-size:21px;font-weight:700;letter-spacing:-.02em}
header small{color:var(--ink3);font-size:13px}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2)}
.ib:hover{color:var(--ink);border-color:var(--line2)}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 제목 */
.top .kick{font-size:14px;font-weight:700;color:var(--or)}
.top h2{font-family:var(--flap);font-size:clamp(28px,2.6vw,42px);line-height:1.3;font-weight:700;letter-spacing:-.025em;margin-top:4px}
.top p{color:var(--ink2);font-size:clamp(17px,1.35vw,22px);margin-top:4px;letter-spacing:-.01em}
.top{min-height:112px}
.fade{animation:fade .45s both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 단계 줄 */
.strip{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:20px;padding:40px 22px 34px;
  background:rgba(20,20,22,.6);border:1px solid var(--line);border-radius:14px}
.st{position:relative;text-align:left;border-radius:10px;padding:9px 11px 10px;background:var(--panel2);border:1px solid rgba(255,255,255,.08);
  transition:background .35s,border-color .35s,opacity .35s;opacity:.55;min-width:0}
.st:hover{opacity:.85}
.st .n{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--ink4)}
.st .t{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .ws{position:absolute;top:-11px;right:6px;display:flex;gap:3px}
.st .w{font-size:11px;font-weight:800;padding:1px 6px;border-radius:9px;background:var(--panel3);color:var(--ink3);border:1px solid var(--line2);white-space:nowrap}
.st::after{content:"";position:absolute;top:50%;right:-21px;width:20px;height:2px;background:rgba(255,255,255,.08);transition:background .35s}
.st:last-child::after{display:none}
.st.done{opacity:.9;border-color:rgba(255,122,26,.35)}
.st.done::after{background:rgba(255,122,26,.55)}
.st.on{opacity:1;background:var(--orbg);border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 10px 30px -12px rgba(255,122,26,.6)}
.st.on .t,.st.done .t{color:var(--ink)}
.st.on .n{color:var(--or2)}
.st[data-w="나"].on{background:var(--ink);border-color:var(--ink);box-shadow:0 10px 30px -12px rgba(241,235,225,.4)}
.st[data-w="나"].on .t{color:#141210} .st[data-w="나"].on .n{color:#7a6a58}
.w.me{background:var(--ink);color:#141210;border-color:var(--ink)}
.w.cc{background:var(--or);color:#1a0d02;border-color:var(--or)}
.w.fl{background:var(--fl);color:#06121f;border-color:var(--fl)}
/* 도구 칩 (본문) */
.chip{display:inline-block;font-size:13px;font-weight:800;padding:1px 8px;border-radius:7px;margin-right:6px;vertical-align:2px;white-space:nowrap}
.chip.me{background:var(--ink);color:#141210}.chip.cc{background:var(--or);color:#1a0d02}.chip.fl{background:var(--fl);color:#06121f}
/* 실제로 시킨 말 */
.say{margin-bottom:12px}
.say .to{font-size:13px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.say .q{background:var(--ink);color:#141210;border-radius:16px 16px 16px 4px;padding:11px 16px;font-size:17.5px;font-weight:600;line-height:1.45;display:inline-block;max-width:100%}
.say.fl .q{background:#0f2233;color:#d9ecff;border:1px solid rgba(91,177,255,.45);font-weight:500;font-size:15px;border-radius:12px}
.say.cc .q{background:var(--orbg);color:var(--or3);border:1px solid rgba(255,122,26,.45);font-weight:500;font-size:15px;border-radius:12px}
/* 0 전체 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tools .card p{font-size:15.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.tools .card b{font-size:19px}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px}
.map button{display:grid;grid-template-columns:44px 110px 1fr;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 14px}
.map button:hover{border-color:var(--or)}
.map .n{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.map .t{font-weight:700;font-size:16px}
.map .d{font-size:14.5px;color:var(--ink2)}
.map .d .chip{font-size:11.5px;padding:0 6px;margin-right:4px}
/* 9 판 목록 */
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:76px 52px 1fr;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.vrow b{font-size:15.5px}.vrow .d{font-family:var(--mono);font-size:13px;color:var(--ink3)}
.vrow .x{font-size:15px;color:var(--ink2)}
.vrow .x q{color:var(--ink);font-weight:600}
/* 2 파일 격자 */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;opacity:0;animation:fade .45s both}
.fcard .ext{align-self:flex-start;padding:3px 10px}
.fcard b{font-size:22px;letter-spacing:-.02em}
.fcard span:last-child{font-size:17px;color:var(--ink2)}
.punch{font-size:23px;font-weight:700;margin-top:18px;line-height:1.5}
/* 3 크게 */
.c2e{grid-template-columns:1fr 1fr}
.big2 .ok li,.big2 .no li{font-size:20px;padding:10px 0}
.big2 .no li small{font-size:15.5px}
.big2 .lab{font-size:16px}
.ask{font-size:17px;margin-top:14px;color:var(--ink2)}
/* 6 탭·흐름 */
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{padding:8px 16px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:15px;font-weight:700;color:var(--ink2)}
.tabs button.on{background:var(--or);color:#1a0d02;border-color:var(--or)}
.chainx{display:grid;grid-template-columns:.7fr 1fr 1fr 1fr;gap:14px;align-items:start}
.cx img,.cx video{width:100%;aspect-ratio:16/9;max-height:150px;object-fit:cover;border-radius:8px;display:block;margin-top:8px}
.cx .say{margin-bottom:0}
.cx .say .q{font-size:14.5px}
.cxh{font-size:13px;color:var(--ink3);margin-bottom:5px;margin-top:2px}
.cx p.small{margin-top:6px}
/* 6 프롬프트 흐름 */
.evo{display:grid;grid-template-columns:150px 1fr 1fr 240px;gap:14px;align-items:start;margin-top:6px}
.evo img{width:100%;border-radius:8px;display:block;background:#fff}
.evo .ar{font-size:14px;color:var(--ink2);line-height:1.5}
.loop{position:absolute;inset:0;pointer-events:none;overflow:visible}
.loop path{fill:none;stroke:var(--or);stroke-width:2;stroke-dasharray:6 6;opacity:0;transition:opacity .4s}
.loop text{fill:var(--or2);font-size:12.5px;font-weight:700;opacity:0;transition:opacity .4s}
.loop.show path,.loop.show text{opacity:1}
.loop.show path{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.legend{position:absolute;top:10px;left:22px;display:flex;gap:14px;font-size:13px;font-weight:600;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 화면 */
.screen{min-height:0;display:flex;flex-direction:column;background:linear-gradient(#17171a,#111113);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 50px -24px rgba(0,0,0,.9)}
.bar{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink3);flex:none}
.bar .dots{display:flex;gap:6px}.bar .dots i{width:9px;height:9px;border-radius:50%;background:#2c2c31}
.bar .tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;border:1px solid var(--line2);color:var(--ink2)}
.bar .tag.real{color:var(--or2);border-color:rgba(255,122,26,.5)}
.body{flex:1;min-height:0;padding:16px 22px;overflow:auto}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}

.screen{position:relative}
.more{position:absolute;right:18px;bottom:14px;padding:8px 16px;border-radius:20px;background:var(--or);color:#1a0d02;font-weight:800;font-size:14px;box-shadow:0 8px 22px -8px rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:opacity .3s}
.more.show{opacity:1;pointer-events:auto}
video{display:block;background:#000;border-radius:10px;max-width:100%}
.vfill{width:100%;height:100%;object-fit:contain}
.cols{display:grid;gap:22px;height:100%;min-height:0}
.c2{grid-template-columns:1.25fr 1fr}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.lab{font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink3);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.lab.o{color:var(--or2)}
.big{font-size:20px;line-height:1.5}
.mid{font-size:17px;line-height:1.55}
.muted{color:var(--ink2)}
.small{font-size:14px;color:var(--ink3)}
.mono{font-family:var(--mono);font-size:13.5px}

/* 1 대화 */
.bub{max-width:640px;margin-top:2px;background:var(--ink);color:#141210;border-radius:18px 18px 4px 18px;padding:14px 20px;font-size:21px;font-weight:600;margin-left:auto}
.bubwho{text-align:right;font-size:13px;color:var(--ink3);margin:6px 4px 10px}
.ai-say{font-size:15px;color:var(--or2);font-weight:700;margin-bottom:8px}
.doc{background:var(--panel2);border:1px solid rgba(255,122,26,.35);border-radius:12px;padding:16px 20px}
.doc h3{font-size:20px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 14px;margin-top:10px;font-size:16px}
.kv b{color:var(--ink3);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.bars div{font-size:14px;color:var(--ink2)}
.bars i{display:block;height:8px;border-radius:4px;background:var(--or);margin-top:5px}
.warn{margin-top:14px;padding:10px 14px;border-radius:9px;background:rgba(255,122,26,.12);border:1px solid rgba(255,122,26,.5);font-size:16px;font-weight:700;color:var(--or3)}

/* 2 폴더 */
.tree{display:flex;flex-direction:column;gap:7px}
.file{display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 14px;
  opacity:0;animation:fade .45s both}
.ext{font-family:var(--mono);font-size:12px;font-weight:600;text-align:center;padding:5px 0;border-radius:6px;background:var(--panel3);color:var(--ink2)}
.file b{font-size:16.5px}
.file span{display:block;font-size:14.5px;color:var(--ink2)}
.arrowbox{display:flex;flex-direction:column;justify-content:center;gap:14px}
.quote{font-size:19px;line-height:1.6;border-left:3px solid var(--or);padding-left:16px}

/* 3 명세서 */
.ok li,.no li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.ok li::before{content:"○ ";color:var(--or2);font-weight:800}
.no li::before{content:"✕ ";color:#ff6b5a;font-weight:800}
.no li small{display:block;color:var(--ink3);font-size:14px;margin-top:2px}

/* 4 대본 */
.diff{display:grid;gap:12px}
.dif{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.dif .s{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.dif del{display:block;color:#a89e92;text-decoration-color:#ff6b5a;text-decoration-thickness:2px;font-size:16.5px;margin-top:4px}
.dif ins{display:block;text-decoration:none;color:var(--ink);font-size:16.5px;font-weight:600;margin-top:3px}
.dif ins::before{content:"→ ";color:var(--or)}
.dif .why{font-size:14px;color:var(--or3);margin-top:5px}
.code{background:#0c0c0e;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--ink2);white-space:pre-wrap}
.code .c{color:#6f8f6a}.code .k{color:var(--or2)}

/* 5 톤 */
.frames{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.6fr 1fr;gap:10px;height:100%;min-height:0}
.frames img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;min-height:0}
.frames .wide{grid-column:span 2}
.rule{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.rule b{font-family:var(--mono);color:var(--or2)}

/* 6 장면 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
.tile .lab{margin-bottom:6px}
.tile video,.tile img{width:100%;border-radius:8px;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
.tile p{font-size:14.5px;color:var(--ink2);margin-top:8px;line-height:1.5}
.pick{position:relative}
.pick .pk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick .pk div{position:relative}
.pick .pk img{aspect-ratio:auto}
.pick .pk div.no img{opacity:.4}
.pick .pk div.yes::after{content:"고름";position:absolute;top:6px;left:6px;font-size:12px;font-weight:800;background:var(--ink);color:#141210;padding:1px 7px;border-radius:7px}
.chev{display:flex;align-items:center;justify-content:center;color:var(--or);font-size:22px}

/* 7 타임라인 */
.tl{display:flex;height:46px;border-radius:8px;overflow:hidden;margin-top:14px;gap:2px}
.tl div{background:var(--panel3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink2);min-width:0;
  opacity:0;animation:fade .3s both}
.tl div.ep{background:var(--orbg);color:var(--or2);border:1px solid rgba(255,122,26,.4)}
.tlax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:6px}

/* 8 녹음 */
.ab{display:flex;gap:8px;margin-bottom:12px}
.ab button,.vers button{padding:9px 16px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:15.5px;font-weight:600;color:var(--ink2)}
.ab button.on{background:var(--or);color:#1a0d02;border-color:var(--or)}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.chain span{padding:6px 11px;border-radius:8px;background:var(--panel3);font-size:14.5px}
.chain i{color:var(--or);font-style:normal}

/* 9 판 */
.vers{display:flex;flex-direction:column;gap:7px}
.vers button{display:grid;grid-template-columns:70px 54px 1fr;gap:10px;align-items:center;text-align:left;padding:9px 14px}
.vers button b{font-size:15.5px;color:var(--ink)}
.vers button .d{font-family:var(--mono);font-size:13px;color:var(--ink3)}
.vers button .x{font-size:14.5px;color:var(--ink2);font-weight:500}
.vers button.on{border-color:var(--or);background:var(--orbg)}
.vers button.on .d{color:var(--or2)}
.who{font-size:13px;font-weight:700;color:var(--ink);background:var(--panel3);padding:1px 7px;border-radius:6px;margin-right:6px}

/* 10 끝 */
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--flap);font-size:30px;letter-spacing:-.02em;color:var(--ink)}
.stat span{font-size:14px;color:var(--ink3)}
.stat .gold b{color:var(--or2)}

/* 아래 */
nav{display:flex;align-items:center;gap:10px}
.dots2{display:flex;gap:6px;flex-wrap:wrap}
.dots2 button{height:30px;min-width:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);font-size:13px;color:var(--ink3);font-family:var(--mono)}
.dots2 button:first-child{display:none}
.dots2 button.on{background:var(--or);border-color:var(--or);color:#1a0d02;font-weight:700}
.dots2 button.done{color:var(--ink2);border-color:rgba(255,122,26,.4)}
.prev{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);font-size:18px;color:var(--ink2)}
.next{height:42px;padding:0 18px 0 20px;border-radius:10px;background:var(--or);color:#1a0d02;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 22px -10px rgba(255,122,26,.9)}
.next:disabled{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--ink3)}

/* 폰·좁은 화면 */
@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;min-height:100vh;padding:10px 16px 16px;grid-template-rows:auto}
  header small,.hint,#full{display:none}
  .top{min-height:0}
  .strip{grid-template-columns:repeat(5,1fr);gap:16px 8px;padding:34px 10px 14px}
  .st{padding:7px 7px 8px}.st .t{font-size:13px;white-space:normal;line-height:1.25;word-break:keep-all}
  .st::after,.loop{display:none}
  .legend{left:10px;top:8px;font-size:11px;gap:10px}
  .screen{min-height:60vh}
  .body{padding:14px;overflow:visible}
  .cols,.c2,.c2e,.tools,.map,.evo,.chainx{grid-template-columns:1fr!important;height:auto}
  .fgrid{grid-template-columns:1fr 1fr}.fcard b{font-size:18px}.fcard span:last-child{font-size:15px}.punch{font-size:19px}
  .tiles{grid-template-columns:1fr}
  .st .ws{position:static;flex-wrap:wrap;margin-bottom:4px}.st .w{font-size:10px;padding:0 4px}
  .st .n{display:none}.strip{padding-top:32px}
  .evo img{max-width:200px}
  .tile .lab{flex-wrap:wrap;font-family:inherit;text-transform:none}
  .frames{height:auto;grid-template-rows:auto}
  .map button{grid-template-columns:36px 1fr}.map .d{grid-column:1/-1}
  .stat{grid-template-columns:1fr 1fr}

      <div class="card"><div class="lab o">${chip('cc')}다듬은 것</div>

const VERS = [

  ['수정', '곡이 짧게 반복돼서 곡 바꿈'],

SC[9] = {

  p: '고칠 점은 내가 말하고, 고치는 건 클로드 코드가 했습니다.',

    <div style="display:flex;flex-direction:column;justify-content:center">
      <div class="lab o">고칠 때 한 말은 이 정도</div>
      ${said('파열음이 좀 큰데? 음악은 키우고 내 목소리는 줄여 줘.', '11월 12일 밤')}
      ${said('좋은데 분량 넘친 거 아니야? 한번 확인해 줘.', '11월 12일 밤')}

SC[10] = {
  kick: '10단계 · 제출', h: '제출 글도 <em>초안은 클로드 코드</em>가.',
  p: '연락처·동의 칸과 제출 버튼은 내가 직접.',
  title: '정리', tag: ['요약', 0],
  html: () => `<div class="cols c2e">

// ---- 아래에 더 있으면 알림
function moreHint() {
  const bd = $('body'), h = $('more');
  const upd = () => h.classList.toggle('show', bd.scrollHeight - bd.clientHeight - bd.scrollTop > 30 && innerWidth > 900);
  bd.onscroll = upd; setTimeout(upd, 300); upd();
}
function moreDown() { const bd = $('body'); bd.scrollBy({ top: bd.clientHeight * .8, behavior: 'smooth' }); }

// ---- 영상 구간 재생
function clip(v, src, a, b, play) {
  v.onloadedmetadata = null; v.ontimeupdate = null;
  if (v.dataset.src !== src) { v.src = src; v.dataset.src = src; }
  const go = () => { v.currentTime = a; if (play) v.play().catch(() => {}); };
  if (v.readyState >= 1) go(); else v.onloadedmetadata = go;
  v.ontimeupdate = () => { if (v.currentTime >= b) { v.pause(); } };
}

// ---- 효과음 (nerv-flow와 같은 소리)
let soundOn = !/mute/.test(location.search), ac = null, noise = null, lastClick = 0;
function actx() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noise = ac.createBuffer(1, ac.sampleRate * .03, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
  }
  return ac;
}
function click(vol = .3, rate = 1) {
  if (!soundOn) return;
  const now = performance.now(); if (now - lastClick < 18) return; lastClick = now;
  try {
    const a = actx(), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noise; s.playbackRate.value = rate * (0.9 + Math.random() * .2);
    f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = .8; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  } catch (e) {}
}
function tick(freq = 660, vol = .06) {
  if (!soundOn) return;
  try {
    const a = actx(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + .3);
  } catch (e) {}
}
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function setSoundIcon() { $('sound').innerHTML = soundOn ? ICON_ON : ICON_OFF; }
$('sound').onclick = () => { soundOn = !soundOn; setSoundIcon(); click(); };
setSoundIcon();

// ---- 단계 줄 만들기
const strip = $('strip');
ST.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'st'; b.dataset.w = s.w.length === 1 && s.w[0] === 'me' ? '나' : '';
  b.innerHTML = `<span class="ws">${s.w.map(k => `<span class="w ${k}">${SHORT[k]}</span>`).join('')}</span><span class="n">${i + 1}단계</span><span class="t">${s.t}</span>`;
  b.onclick = () => { click(); go(i + 1); };
  strip.appendChild(b);
});
const dots = $('dots');
[''].concat(ST.map((_, i) => String(i + 1).padStart(2, '0'))).forEach((t, i) => {
  const b = document.createElement('button'); b.textContent = t; b.onclick = () => { click(); go(i); }; dots.appendChild(b);
});
function drawLoop() {
  const sb = strip.getBoundingClientRect(), bs = strip.querySelectorAll('.st');
  const a = bs[8].getBoundingClientRect(), c = bs[7].getBoundingClientRect();
  const x1 = a.left - sb.left + a.width / 2, x2 = c.left - sb.left + c.width / 2, y = a.bottom - sb.top;
  $('loop').setAttribute('width', sb.width); $('loop').setAttribute('height', sb.height);
  $('loopP').setAttribute('d', `M${x1},${y + 2} C${x1},${y + 24} ${x2},${y + 24} ${x2},${y + 4}`);
  $('loopT').setAttribute('x', (x1 + x2) / 2); $('loopT').setAttribute('y', y + 30);
}

// ---- 화면 바꾸기
let cur = -1;
function go(n) {
  n = Math.max(1, Math.min(10, n));
  document.querySelectorAll('video').forEach(v => v.pause());
  const s = SC[n];
  $('top').innerHTML = `<div class="fade"><div class="kick">${s.kick}</div><h2>${s.h}</h2><p>${s.p}</p></div>`;
  $('btitle').textContent = s.title;
  $('btag').textContent = s.tag[0]; $('btag').className = 'tag' + (s.tag[1] ? ' real' : '');
  $('body').innerHTML = `<div class="fade" style="height:100%">${s.html()}</div>`;
  $('body').scrollTop = 0;
  strip.querySelectorAll('.st').forEach((b, i) => { b.classList.toggle('on', i + 1 === n); b.classList.toggle('done', i + 1 < n); });
  dots.querySelectorAll('button').forEach((b, i) => { b.classList.toggle('on', i === n); b.classList.toggle('done', i < n); });
  $('loop').classList.toggle('show', n === 9);
  $('prev').disabled = n === 1;
  $('next').innerHTML = n === 0 ? '1단계부터 보기 <span>›</span>' : n === 10 ? '끝' : `다음: ${ST[n].t} <span>›</span>`;
  $('next').disabled = n === 10;
  if (n > 0 && n !== cur) tick(520 + n * 28);
  cur = n;
  if (s.on) s.on();
  try { history.replaceState(null, '', '#' + n); } catch (e) {}
}
$('next').onclick = () => { click(); go(cur + 1); };
$('prev').onclick = () => { click(); go(cur - 1); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});
function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
$('full').onclick = toggleFull;
function fit() { const r = document.documentElement; const z = innerWidth > 900 ? Math.min(1, innerWidth / 1600, innerHeight / 900) : 1; r.style.zoom = z; r.style.setProperty('--z', z); drawLoop(); }
addEventListener('resize', fit); fit();
go(+(location.hash.slice(1)) || 1);
requestAnimationFrame(drawLoop);
document.fonts && document.fonts.ready.then(drawLoop);
</script>
